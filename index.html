<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Planner</title>
<meta name="description" content="Shared family calendar, meal plans, pantry and grocery list.">
<meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --card2:#f8f3eb; --ink:#2b2622; --muted:#7c7166; --line:#e7ded1;
  --accent:#2f5d50; --accent-ink:#ffffff; --accent-soft:#e2ede8; --pline:#d3c8b8;
  --warm:#b85d32; --warm-soft:#f7e6dc;
  --danger:#b3412e; --danger-soft:#f8e2dd; --good:#2f7a52;
  --shadow:0 1px 2px rgba(70,45,20,.05),0 6px 18px rgba(70,45,20,.06);
  --r:18px; --tabh:64px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191816; --card:#24221f; --card2:#2c2a26; --ink:#f2ede5; --muted:#a69d91; --line:#3a3631;
    --accent:#86c2ad; --accent-ink:#0f1f19; --accent-soft:#233630; --pline:#4a443c;
    --warm:#e49a6b; --warm-soft:#3a2a20; --danger:#ec8a76; --danger-soft:#3b2420; --good:#8fd0ad; --shadow:0 1px 0 rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 28px);-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);font-weight:700}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
svg{display:block}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:62px}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:.8rem;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:.76rem;font-weight:800;color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:#3f9a6e}
.pill.busy .dot{background:var(--warm);animation:pulse 1s infinite}
.pill.err{color:var(--danger)} .pill.err .dot{background:var(--danger)}
.pill.off .dot{background:#c9a227}
@keyframes pulse{50%{opacity:.25}}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0}
.icon-btn svg{width:20px;height:20px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh);padding:0 6px}
.tabs button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:800;color:var(--muted);padding:0}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--accent)}
.badge-n{position:absolute;top:7px;left:calc(50% + 6px);background:var(--warm);color:#fff;font-size:.62rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* pills — the one style for every switch and filter */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.toolbar .pills{margin:0;flex:1;min-width:0}
.pbtn{flex:1 1 auto;min-height:48px;border:2px solid var(--pline);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:800;font-size:1rem;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s,transform .08s}
.pills.even .pbtn{flex:1 1 0;min-width:0}
.pills.quad{display:grid;grid-template-columns:1fr 1fr}
.pbtn:active{transform:scale(.97)}
.pbtn em{font-style:normal;font-size:.8rem;font-weight:800;color:var(--muted);background:var(--card2);border-radius:999px;padding:1px 8px;min-width:24px;text-align:center}
.pbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.pbtn.on em{background:rgba(255,255,255,.22)}
.pbtn.on em{color:inherit;opacity:.8}
.pbtn[style*="--c"].on{background:var(--c);border-color:var(--c);color:var(--ci,#fff);box-shadow:0 2px 8px color-mix(in srgb,var(--c) 40%,transparent)}
.pbtn[style*="--c"]:not(.on){border-color:color-mix(in srgb,var(--c) 45%,var(--pline))}
.pbtn[style*="--c"]:not(.on)::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c)}
.toolbar > .btn{min-height:48px;border-radius:999px;border-width:2px;border-color:var(--pline);padding:10px 18px;font-size:1rem}
#view > .pills:first-child{margin-top:16px}
/* collapsible sections — the one style for every list */
.sec{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.sec-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink);min-height:50px}
.sec-title{flex:1;min-width:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.03rem;color:var(--accent)}
.sec-sub{font-family:'Nunito Sans',system-ui,sans-serif;font-size:.8rem;font-weight:700;color:var(--muted);margin-left:4px}
.sec-sub.today-tag{color:var(--warm);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.7rem}
.sec.kid{border-color:color-mix(in srgb,var(--kc) 55%,var(--line))}
.sec.kid .sec-title{color:var(--kc)}
.sec.make{border-color:color-mix(in srgb,var(--warm) 45%,var(--line))}
.sec.make .sec-title{color:var(--warm)}
.sec.muted .sec-title{color:var(--muted)}
.sec-count{font-size:.74rem;font-weight:800;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.sec-head .chev{color:var(--muted);display:grid;transition:transform .15s;transform:rotate(90deg)}
.sec-head .chev svg{width:16px;height:16px}
.sec.closed .sec-head .chev{transform:rotate(0deg)}
.sec.closed .sec-body{display:none}
.sec-body{border-top:1px solid var(--line)}
.sec-body > :first-child{border-top:0}
.sec-body.rows{padding:0 14px}
.sec-tools{padding:12px 14px 2px}
.sec-tools .toolbar{margin:0 0 10px}
.sec.today{border-color:var(--warm);box-shadow:0 0 0 1px var(--warm),var(--shadow)}
.sec .rec{border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;margin:0}
.sec .empty{padding:12px 14px}
.addrow{border-top:1px solid var(--line);padding:10px 14px}
.addrow .linkbtn{text-decoration:none;color:var(--accent);display:inline-flex;align-items:center;gap:6px;font-size:.92rem;min-height:32px}
.addrow .linkbtn svg{width:16px;height:16px}
.tryrow{border-top:1px solid var(--line)}
.rrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.sec-body > .rrow:first-child{border-top:0}
.rrow > .rec{flex:1;min-width:0;border-top:0 !important;padding-right:4px}
.delbtn{width:40px;height:44px;flex:none;border:0;background:none;color:var(--muted);opacity:.55;display:grid;place-items:center;padding:0;border-radius:10px}
.delbtn svg{width:18px;height:18px}
.delbtn:active,.delbtn:hover{opacity:1;color:var(--danger)}
.rrow > .delbtn{margin-right:6px}
.mk .delbtn{width:34px}
.trashrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 8px 10px 14px}
.sec-body > .trashrow:first-child{border-top:0}
.trashrow .tn{flex:1;min-width:0;font-weight:800;color:var(--muted)}
.trashrow .tn small{display:block;font-size:.74rem;font-weight:700}
.trashrow .tbtn{flex:none;min-height:40px;padding:6px 14px}
.trash-tools{padding:10px 14px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.trash-tools .btn{white-space:nowrap;flex:none}
.trash-tools .hint{margin:0}
.sec.trash .sec-title{color:var(--muted);display:flex;align-items:center;gap:8px}
.sec.trash .sec-title svg{width:18px;height:18px}
.toast.has-act{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;text-align:left}
.toast.show.has-act{pointer-events:auto}
.toast.ok{background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;padding:12px 18px}
.toast.ok svg{width:20px;height:20px;flex:none}
.savedbox{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;font-weight:800;font-size:1.02rem;margin-bottom:14px;animation:pop .35s ease}
.savedbox > svg{width:28px;height:28px;flex:none;background:rgba(255,255,255,.22);border-radius:50%;padding:5px}
.savedbox small{display:block;font-weight:700;opacity:.88;font-size:.82rem}
@keyframes pop{0%{transform:scale(.94);opacity:0}60%{transform:scale(1.02);opacity:1}100%{transform:none}}
.toast-btn{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;border-radius:999px;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;flex:none;font-size:.9rem}
.toast-btn svg{width:15px;height:15px}
.ask{position:fixed;inset:0;z-index:80;background:rgba(20,16,12,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.ask[hidden]{display:none}
.ask-card{background:var(--bg);border-radius:18px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.ask-card p{margin:0 0 14px;font-weight:700;line-height:1.45}
.ask-card textarea{margin-bottom:14px;min-height:90px;font-size:14px}
.ask-btns{display:flex;gap:8px}
.ask-btns .btn{flex:1;min-height:48px;border-radius:999px}
.warnbox.nosave{margin-top:14px;font-size:.9rem;line-height:1.4}
.btn.subtle-del{color:var(--muted);border-color:transparent;font-weight:700}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.sec-body > .tryrow:first-child{border-top:0}
.tryrow > .rec,.tryrow > .mk{border-top:0}
.tryacts{display:flex;gap:8px;padding:0 14px 12px}
.tbtn{flex:1 1 0;min-width:0;min-height:44px;border-radius:999px;border:2px solid var(--pline);background:var(--card);font-weight:800;font-size:.92rem;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;white-space:nowrap}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn.keep{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--pline));color:var(--accent)}
.tbtn.drop{color:var(--danger)}
.tbtn:active{transform:scale(.97)}
.trybox{border:2px dashed color-mix(in srgb,var(--warm) 50%,var(--line));background:color-mix(in srgb,var(--warm-soft) 55%,var(--card));border-radius:14px;padding:12px;margin:0 0 14px;line-height:1.45}
.trybox p{margin:0 0 10px;font-size:.92rem}
.trybox .tryacts{padding:0}
.sec-body > .rec:first-child,.sec-body > .gi:first-child,.sec-body > .pi:first-child{border-top:0}
/* toolbars */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 10px}
.toolbar input[type=search]{flex:1}
.weeknav{display:flex;align-items:center;gap:8px;margin:10px 0 14px}
.weeknav .wl{flex:1;text-align:center}
.weeknav h2{font-size:1.2rem}
.weeknav small{display:block;color:var(--muted);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;min-height:1.1em}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.navbtn svg{width:18px;height:18px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:800;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-align:center}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm{padding:7px 12px;font-size:.84rem;border-radius:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.linkbtn{border:0;background:none;color:inherit;text-decoration:underline;font-weight:800;padding:0;font-size:inherit}

.banner{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1.5px solid var(--warm);background:var(--warm-soft);border-radius:14px;padding:11px 14px;margin:14px 0 2px;color:var(--ink)}
.banner b{font-size:.95rem}
.banner span{font-size:.8rem;color:var(--muted);font-weight:700}

.badge{font-size:.7rem;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap;flex:none}
.badge.ready{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.badge.need{color:var(--muted);background:var(--card2);border:1px solid var(--line)}
.badge.try{color:var(--warm);background:var(--warm-soft)}
.badge.idea{color:var(--accent);background:var(--accent-soft);margin-left:6px}
.badge.who{color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.stag{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap;flex:none}
.warn{display:block;font-size:.76rem;font-weight:800;color:var(--danger)}

/* calendar day cards */
.day{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 10px;margin-bottom:10px;box-shadow:var(--shadow);scroll-margin-top:84px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.day.past{opacity:.7}
.dblock{width:46px;flex:none;text-align:center;padding-top:2px;border:0;background:none;color:inherit}
.dblock .dn{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dblock .dd{font-family:Fraunces,Georgia,serif;font-size:1.65rem;font-weight:700;line-height:1.1}
.day.today .dn,.day.today .dd{color:var(--accent)}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.dhead .lbl{font-size:.78rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.day.today .dhead .lbl{color:var(--accent)}
.add-mini{border:1px dashed var(--line);background:none;border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:800;color:var(--muted)}
.ev{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--card2);border-radius:12px;padding:9px 10px;border-left:4px solid var(--c,var(--accent))}
.ev-time{font-size:.76rem;font-weight:800;color:var(--muted);min-width:54px}
.ev-title{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.ev-title .rep{display:inline-block;color:var(--muted);vertical-align:-1px;margin-left:3px}
.ev-title .rep svg{width:13px;height:13px}
.ev-who{font-size:.72rem;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);padding:2px 8px;border-radius:999px;white-space:nowrap}
.meal-chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:var(--warm-soft);border-radius:12px;padding:7px 10px;font-size:.9rem;font-weight:700;color:var(--ink)}
.meal-chip .mc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.meal-chip .mc-main b{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--warm);font-weight:800}
.meal-chip.kid{background:color-mix(in srgb,var(--kc) 13%,var(--card))}
.meal-chip.kid .mc-main b{color:var(--kc)}
.meal-chip.made{background:var(--accent-soft)}
.meal-chip.made .mc-main b{color:var(--accent)}
.meal-chip.skipped{opacity:.55}
.meal-chip .go{color:var(--muted);flex:none}
.meal-chip .go svg{width:15px;height:15px}
.empty{color:var(--muted);font-size:.88rem;padding:2px 0}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 -10px 12px;overflow:hidden}
.mh{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.mc{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;border-radius:0;display:flex;flex-direction:column;align-items:stretch;padding:4px 2px 6px;gap:3px;font-weight:700;font-size:.9rem;min-height:112px;min-width:0;overflow:hidden;color:var(--ink);gap:2px}
.mc:nth-child(7n){border-right:0}
.mc.other{opacity:.38}
.mc .n{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;align-self:center;flex:none}
.mc.today .n{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.mc.sel{background:var(--accent-soft)}
.mc .lab{font-size:.58rem;font-weight:800;line-height:1.16;letter-spacing:-.01em;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;padding:0 2px 0 3px;max-height:2.32em;flex:none;border-radius:4px;border-left:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);text-align:left}
.mc .lab.ev{background:color-mix(in srgb,var(--c) 30%,transparent);border-left-width:3px}
.mc .more{font-size:.58rem;font-weight:800;color:var(--muted);text-align:left;padding-left:4px}
@media (min-width:560px){.mgrid{margin:0 0 12px}.mc{min-height:132px;padding:6px 5px 8px}.mc .lab{font-size:.72rem;padding:2px 4px 2px 5px;border-left-width:3px}}

/* meals */
.slot{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:11px 2px;text-align:left;color:var(--ink)}
.slot:first-of-type{border-top:0}
.slot .sn{width:78px;flex:none;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot .sv{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.slot .sv.none{color:var(--muted);font-weight:600}
.slot.made .sv .nm,.slot.skipped .sv .nm{color:var(--muted)}
.slot.skipped .sv .nm{text-decoration:line-through}
.slot .incart{color:var(--warm)}
.slot .incart svg{width:17px;height:17px}

/* groceries */
.addbar{display:flex;gap:8px;margin:0 0 12px}
.addbar input{flex:1;min-width:0}
.gsum{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-weight:800;color:var(--muted);font-size:.88rem}
.gacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gi{display:flex;align-items:center;border-top:1px solid var(--line)}

.gi-main{flex:1;min-width:0}

/* pantry */
.pi{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:7px 10px 7px 14px}

.pi-name{font-weight:700;display:block;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;min-width:0}
.pi-sub{font-size:.74rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hv{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.hvb{border:0;background:var(--card);padding:8px 11px;font-size:.8rem;font-weight:800;color:var(--muted)}

.hvb.on.have{background:var(--accent);color:var(--accent-ink)}

.pi-main{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:6px 0;color:var(--ink);cursor:pointer}
.pi-main .chev{color:var(--muted);margin-left:auto;margin-right:4px}
.pi-main .chev svg{width:15px;height:15px}
.mk{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 8px 6px 0}
.mk:first-child{border-top:0}
.mk-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 0 6px 14px;color:var(--ink)}
.mk-name{display:block;font-weight:800}
.mk-sub{display:block;font-size:.74rem;color:var(--muted);font-weight:700}

.slot .sv.open{color:var(--good)}
.slotrow.kidrow{background:color-mix(in srgb,var(--kc) 8%,transparent);margin:0 -14px;padding:0 14px}

.daygroup{padding:0 14px}
.replanbar{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:10px 10px 10px 14px;margin:14px 0 4px;font-size:.88rem;line-height:1.35}

.rec svg{width:18px;height:18px;color:var(--muted);flex:none}

.ing-s.make{color:var(--warm);background:var(--warm-soft)}

.addlist.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.addlist-sp{width:36px;flex:none}
.seerec{display:block;font-size:.78rem;color:var(--accent);text-decoration:none;margin-top:2px;text-align:left}
.slotrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.slotrow:first-of-type{border-top:0}
.slotrow .slot{border-top:0;flex:1;min-width:0}
.slotrow .gi-more{width:40px;height:40px;margin-right:-6px}
.slot .seerec{display:inline-block;font-weight:800}
.slot .sv .nm{display:block}
.rec .rn small{display:block;font-size:.68rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.mrow.off{opacity:.5;cursor:default}
.notes{white-space:pre-wrap;margin:0 2px 10px;line-height:1.5}
.when{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}

/* forms */
input[type=text],input[type=search],input[type=date],input[type=time],input[type=url],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;min-width:0}

.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.hint{font-size:.83rem;color:var(--muted);margin:-4px 0 12px;line-height:1.45}

.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:.9rem;background:var(--card);cursor:pointer}
.chip input:checked+span{background:var(--c);border-color:var(--c);color:#fff}
.chip input:focus-visible+span{box-shadow:0 0 0 3px var(--accent-soft)}
.chipbtn{border:2px solid var(--pline);background:var(--card);border-radius:999px;padding:10px 16px;min-height:46px;font-weight:800;font-size:.95rem;color:var(--ink)}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stack{display:flex;flex-direction:column;gap:8px}

/* fab */
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);z-index:15;width:58px;height:58px;border-radius:19px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(30,60,50,.28);display:grid;place-items:center;padding:0}
.fab svg{width:26px;height:26px}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(20,15,10,.45);animation:fade .18s}
.sheet{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}

.icon-btn.share-btn{color:var(--accent)}

.slotrow .gi-share svg{width:18px;height:18px}
.sheet-actions{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.sheet-actions .btn.primary{flex:1}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;margin:10px 0 12px}
.picklist .rgroup{margin:8px 2px 2px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px 11px 14px;font-weight:800;color:var(--ink)}
.pick .pn{flex:1;min-width:0}
.pick.on{border-color:var(--warm);background:var(--warm-soft)}
.divider{height:1px;background:var(--line);margin:18px 0}
.set-sec h3{font-size:1.08rem;margin:2px 0 10px}
.person-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.person-row input[type=color]{width:46px;height:46px;flex:none;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--card)}

.statusbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:12px;line-height:1.45}
.warnbox{border:1.5px solid var(--danger);background:var(--danger-soft);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.warnbox b{color:var(--danger)}
.madebox{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:800;margin-bottom:12px}
.swapcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.sw-when{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sw-name{font-weight:800;font-size:1.05rem}
.sw-need{font-size:.84rem;color:var(--danger);font-weight:700}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.mrow:first-child{border-top:0}
.mname{flex:1;font-weight:700;min-width:0}

.daygroup{padding:0 12px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

<header class="top"><div class="wrap">

function occursOn(ev, d) {

    case 'monthly': return parseISO(d).getDate() === parseISO(ev.date).getDate();

}

/* ---------------- grocery list ---------------- */
function buildGroceries(ws) {
  const map = new Map(), loose = [];
  const add = (key, base, it, r, g) => {
    let gg = map.get(key);
    if (!gg) { gg = { key: key, base: base, name: it.name, unit: it.unit, qty: 0, hasQty: false, from: new Set(), groups: new Set() }; map.set(key, gg); }
    if (it.qty != null) { gg.qty += it.qty; gg.hasQty = true; }
    gg.from.add(r.name); gg.groups.add(g);
  };
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    allSlots().forEach(x => {
      const p = planEntry(d, x.g, x.s), r = planRecipe(d, x.g, x.s);
      if (!p || !r || p.made || p.skipped) return;
      String(r.ingredients || '').split('\n').forEach(line => {
        const it = parseLine(line); if (!it || it.home) return;
        const base = itemKey(it.name);
        if (it.qty == null && !it.unit) loose.push({ base: base, it: it, r: r, g: x.g });
        else add(base + '|' + it.unit, base, it, r, x.g);
      });
    });
  }
  loose.forEach(x => {
    const hit = Array.from(map.values()).find(v => v.base === x.base);
    if (hit) { hit.from.add(x.r.name); hit.groups.add(x.g); } else add(x.base + '|', x.base, x.it, x.r, x.g);
  });
  return Array.from(map.values());
}
function groceryModel(ws) {
  const rows = [], byBase = {}, grouped = new Map();
  buildGroceries(ws).forEach(gg => { // one row per item, even when recipes use different units ("1 pint + 1 cup")
    let a = grouped.get(gg.base);
    if (!a) { a = { base: gg.base, name: gg.name, unit: gg.unit, parts: [], from: new Set(), groups: new Set() }; grouped.set(gg.base, a); }
    a.parts.push(gg); gg.from.forEach(x => a.from.add(x)); gg.groups.forEach(x => a.groups.add(x));
  });
  grouped.forEach(a => {
    const ck = data.checks[ws + '|' + a.base];
    const qty = a.parts.map(gg => gg.hasQty ? fmtQty(gg.qty) + (gg.unit ? ' ' + unitFor(gg.unit, gg.qty) : '') : (gg.unit || '')).filter(Boolean).join(' + ');
    const row = { k: 'm:' + ws + '|' + a.base, ck: ws + '|' + a.base, base: a.base, name: nameFor(a.base, a.name), unit: a.unit, qty: qty,
      recipes: Array.from(a.from), gset: a.groups, notes: [], extras: [], meal: true, mealChecked: !!(ck && !ck.deleted && ck.checked) };
    rows.push(row); byBase[a.base] = row;
  });
  live('extras').sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0)).forEach(x => {
    const base = itemKey(x.name); let row = byBase[base];
    if (!row) { row = { k: 'x:' + x.id, base: base, name: nameFor(base, x.name), unit: '', qty: '', recipes: [], gset: null, notes: [], extras: [], meal: false }; rows.push(row); byBase[base] = row; }
    row.extras.push(x); if (x.note && !x.checked) row.notes.push(x.note);
  });
  rows.forEach(r => {
    r.checked = (r.meal ? r.mealChecked : true) && r.extras.every(x => x.checked);
    r.explicit = r.extras.some(x => !x.checked);
    r.status = statusOf(r.base);
    r.section = r.checked ? 'cart' : (r.explicit || r.status !== 'have') ? 'get' : 'home';
    r.cat = catFor(r.base, r.name, r.unit); r.store = storeFor(r.base); r.who = whoFor(r.base, r.name, r.gset);
    r.notes = r.notes.filter((n, i, a) => a.indexOf(n) === i && !(n.indexOf('For ') === 0 && r.recipes.indexOf(n.slice(4)) >= 0));
    r.from = (r.recipes.length ? [r.recipes[0] + (r.recipes.length > 1 ? ' + ' + (r.recipes.length - 1) + ' more' : '')] : []).concat(r.notes).join(' · ');
  });
  return rows;
}

/* ---------------- pantry list ---------------- */
function pantryItems() {
  const map = {};

    if (!base) return;
    let m = map[base]; if (!m) m = map[base] = { base: base, name: cap(name), recipes: [], gset: new Set() };
    if (recipe) { if (m.recipes.indexOf(recipe.name) < 0) m.recipes.push(recipe.name); m.gset.add(recipeFor(recipe)); }
  };
  live('recipes').forEach(r => recipeParts(r).forEach(p => add(p.base, p.name, r)));
  live('items').forEach(it => { if (!it.hidden) add(it.id, it.name || it.id); });

}

/* ---------------- sync with GitHub ---------------- */
let sync = Object.assign({ owner: '', repo: '', path: 'data.json', branch: '', token: '', device: '' }, readJSON(KEY_SYNC, {}));
const syncOn = () => !!(sync.owner && sync.repo && sync.token);
let syncState = { status: 'local', msg: '', last: 0 };
let syncing = false, syncAgain = false, syncTimer = null;

function setSync(status, msg) {

  if (status === 'ok') syncState.last = now();
  renderPill();
  const box = $('#syncStatus'); if (box) box.innerHTML = syncStatusHTML();
}
function renderPill() {
  const labels = { local: 'This phone', busy: 'Syncing…', ok: 'Synced', off: 'Offline', err: 'Sync issue' };
  const p = $('#syncPill'); p.className = 'pill ' + syncState.status;
  p.innerHTML = '<span class="dot"></span>' + labels[syncState.status];
}
function syncStatusHTML() {
  if (!syncOn()) return 'Saved on this device only. Paste your GitHub token below so both phones share one planner.';
  const where = '<b>' + esc(sync.owner) + '/' + esc(sync.repo) + '</b>';
  switch (syncState.status) {
    case 'busy': return 'Syncing with ' + where + '…';
    case 'ok': return '✓ In sync with ' + where + (syncState.last ? ' · ' + new Date(syncState.last).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '');
    case 'off': return esc(syncState.msg);
    case 'err': return '<span style="color:var(--danger);font-weight:700">' + esc(syncState.msg) + '</span>';
    default: return 'Connected to ' + where;
  }
}
function repoURL() { return 'https://api.github.com/repos/' + encodeURIComponent(sync.owner) + '/' + encodeURIComponent(sync.repo); }
function fileURL(withRef) {
  const p = String(sync.path || 'data.json').split('/').map(encodeURIComponent).join('/');
  return repoURL() + '/contents/' + p + (withRef && sync.branch ? '?ref=' + encodeURIComponent(sync.branch) : '');
}
function ghHeaders(extra) { return Object.assign({ Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json' }, extra || {}); }
async function ghError(r) {
  let m = ''; try { m = (await r.json()).message || ''; } catch (e) {}
  const map = {
    401: 'GitHub says the token is invalid or expired. Make a new one and paste it in Settings.',
    403: 'GitHub refused the save. The token needs “Contents: Read and write” on this repo.' + (m ? ' (' + m + ')' : ''),
    404: 'Couldn’t find that repo. Check the username and repo name, and that the token includes this repo.'
  };

  err.status = r.status; return err;
}
async function ghGet() {
  const r = await fetch(fileURL(true), { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) {
    const rr = await fetch(repoURL(), { headers: ghHeaders(), cache: 'no-store' });
    if (!rr.ok) throw await ghError(rr);
    return { data: null, sha: null };
  }
  if (!r.ok) throw await ghError(r);
  const j = await r.json();
  let text;
  if (j.content) text = b64decode(j.content);
  else {
    const r2 = await fetch(fileURL(true), { headers: ghHeaders({ Accept: 'application/vnd.github.raw+json' }), cache: 'no-store' });
    if (!r2.ok) throw await ghError(r2);
    text = await r2.text();
  }
  if (!text.trim()) return { data: null, sha: j.sha };
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { throw new Error('The data file on GitHub isn’t valid JSON. Restore a backup or delete the file, then sync again.'); }

}
async function ghPut(d, sha) {
  const body = { message: 'Planner update' + (sync.device ? ' from ' + sync.device : ''), content: b64encode(JSON.stringify(d, null, 1) + '\n') };
  if (sha) body.sha = sha;
  if (sync.branch) body.branch = sync.branch;
  const r = await fetch(fileURL(false), { method: 'PUT', headers: ghHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return false; // the other phone saved first: re-read and merge
  if (!r.ok) throw await ghError(r);
  return true;
}
async function runSync() {
  if (!syncOn()) { setSync('local'); return; }
  if (syncing) { syncAgain = true; return; }
  if (navigator.onLine === false) { setSync('off', 'Offline — changes are saved on this phone and will sync when you’re back online.'); return; }
  syncing = true; setSync('busy');
  try {
    let done = false;
    for (let i = 0; i < 4 && !done; i++) {
      const remote = await ghGet();
      const merged = prune(remote.data ? mergeData(data, remote.data) : normalize(JSON.parse(JSON.stringify(data))));
      const changed = stable(merged) !== stable(data);
      data = merged; saveLocal();
      if (changed) { render(); if (!$('#sheet').hidden && sheetCtx.view === 'recipe') refreshRecipe(); }
      if (remote.data && stable(merged) === stable(remote.data)) { done = true; break; }
      done = await ghPut(merged, remote.sha);
    }
    if (!done) throw new Error('GitHub kept rejecting the save. Tap “Sync now” to try again.');
    setSync('ok');
  } catch (e) {
    if (e && e.name === 'TypeError') setSync('off', 'Can’t reach GitHub right now — changes are saved on this phone and will sync later.');
    else setSync('err', (e && e.message) || 'Sync failed.');

    if (syncAgain) { syncAgain = false; setTimeout(runSync, 250); }
  }
}

  'toggle-sec': b => {
    const id = b.dataset.id, now = !isClosed(id, b.dataset.def === '1'), el = b.closest('.sec');
    ui.closed[id] = now; saveUI(); el.classList.toggle('closed', now); b.setAttribute('aria-expanded', String(!now));
  },
  'plan-slot': b => { ui.planSlot = b.dataset.v; saveUI(); render(); },
  'new-recipe-for': b => openRecipe(null, null, b.dataset.gid, b.dataset.slot),
  'meal-view': b => { ui.mealView = b.dataset.v; saveUI(); render(); window.scrollTo(0, 0); },
  'try-keep': b => {
    const r = data.recipes[b.dataset.id]; if (isGone(r)) return;
    const m = tryPartner(r), both = !!(m && m.tag === 'try');
    put('recipes', r.id, Object.assign({}, r, { tag: 'regular' }));
    if (both) put('recipes', m.id, Object.assign({}, m, { tag: 'regular' }));
    commit(); toast(r.name + ' moved to ' + regularLabel(r) + (both ? ' — ' + groupName(recipeFor(m)) + '’s too' : ''));
    if (!$('#sheet').hidden && sheetCtx.view === 'recipe') refreshRecipe();
  },
  'try-drop': b => {
    const r = data.recipes[b.dataset.id]; if (isGone(r)) return;
    const m = tryPartner(r), both = !!(m && m.tag === 'try');
    trashAndTell(r.id);
  },
  'trash-recipe': b => trashAndTell(b.dataset.id),
  'restore-recipe': b => {
    const back = restoreRecipe(b.dataset.id); if (!back.length) return;
    commit(); toast('Brought back ' + back[0].name + (back.length > 1 ? ' + ' + groupName(recipeFor(back[1])) + '’s' : ''));
  },
  'purge-recipe': b => {
    const r = data.recipes[b.dataset.id]; if (!r || !r.trashed) return;
    ask('Delete “' + r.name + '” forever? This can’t be undone.', 'Delete forever', () => { remove('recipes', r.id); commit(); toast('Deleted for good'); }, { danger: true });
  },
  'empty-trash': () => {
    const list = trashedRecipes(); if (!list.length) return;
    ask('Delete all ' + plural(list.length, 'meal') + ' in the trash forever? This can’t be undone.', 'Empty trash', () => { list.forEach(r => remove('recipes', r.id)); commit(); toast('Trash emptied'); }, { danger: true });
  },
  'toast-act': () => { const a = toastAct; toastAct = null; $('#toast').classList.remove('show', 'has-act'); if (a) a.fn(); },
  'ask-yes': () => { const f = askFn, v = $('#askInput').value; closeAsk(); if (f) f(v); },
  'ask-no': () => closeAsk(),
  'delete-recipe': () => {
    const r = data.recipes[sheetCtx.recipeId]; if (isGone(r)) return;
    closeSheet(); trashAndTell(r.id);
  },
  'go-groceries': () => setTab('groceries'),
  'clear-week': () => {
    const g = planGroup(), gs = g === 'all' ? groupIds() : [g];
    ask('Clear ' + (g === 'all' ? 'everyone’s meals' : g === 'family' ? 'our meals' : groupName(g) + '’s meals') + ' for ' + weekLabel(ui.mealWeek) + '?', 'Clear week', () => {
      for (let i = 0; i < 7; i++) { const d = addDays(ui.mealWeek, i); gs.forEach(gg => slotsOf(gg).forEach(s => { if (planEntry(d, gg, s)) remove('plan', pkey(d, gg, s)); })); }
      commit();
    }, { danger: true });
  },
  'store-filter': b => { ui.store = b.dataset.v; saveUI(); render(); },
  'share-list': () => {
    const stores = data.settings.stores, sel = stores.indexOf(ui.store) >= 0 ? ui.store : 'all';
    const rows = groceryModel(ui.mealWeek).filter(r => r.section === 'get');
    let t = (sel === 'all' ? 'Grocery list' : sel + ' list') + ' — ' + weekLabel(ui.mealWeek) + '\n';
    const line = r => '☐ ' + r.name + (r.qty ? ' (' + r.qty + ')' : '');
    const block = list => kidGroups().map(k => { const its = list.filter(r => r.who === k.id).sort(byCatName); return its.length ? '\nFOR ' + k.name.toUpperCase() + '\n' + its.map(line).join('\n') + '\n' : ''; }).join('') +
      CATS.map(c => { const its = list.filter(r => r.who === 'family' && r.cat === c).sort(byName); return its.length ? '\n' + c.toUpperCase() + '\n' + its.map(line).join('\n') + '\n' : ''; }).join('');
    const make = rows.filter(r => r.store === HOME).sort(byName);
    if (make.length) t += '\nMAKE AT HOME\n' + make.map(line).join('\n') + '\n';
    if (sel === 'all') stores.forEach(s => { const l = rows.filter(r => r.store === s); if (l.length) t += '\n== ' + s.toUpperCase() + ' ==' + block(l); });
    else t += block(rows.filter(r => r.store === sel));
    if (navigator.share) navigator.share({ title: 'Grocery list', text: t }).catch(() => {});
    else copyText(t).then(() => toast('List copied'));
  },
  'clear-checked': () => {
    let n = 0; live('extras').forEach(x => { if (x.checked) { remove('extras', x.id); n++; } });
    toast('Cleared ' + plural(n, 'checked item')); commit();
  },
  'need-it': b => goOut(b.dataset.base, b.dataset.name, 'Need more'),
  'item-menu': b => openItemMenu(b.dataset.k),
  'set-who': b => { setItem(sheetCtx.base, { name: sheetCtx.name, who: b.dataset.v }); commit(); toast('Moved to ' + (b.dataset.v === 'family' ? 'the family list' : groupName(b.dataset.v) + '’s section')); openItemMenu(sheetCtx.k); },
  'set-store': b => { setItem(sheetCtx.base, { name: sheetCtx.name, store: b.dataset.v }); commit(); toast(b.dataset.v === HOME ? 'Moved to Make at home' : 'Now on the ' + b.dataset.v + ' list'); openItemMenu(sheetCtx.k); },
  'set-cat': b => { setItem(sheetCtx.base, { name: sheetCtx.name, cat: b.dataset.v }); commit(); openItemMenu(sheetCtx.k); },
  'set-status': b => {
    const v = b.dataset.v, base = sheetCtx.base, name = sheetCtx.name, k = sheetCtx.k;
    if (v === 'out') { if (statusOf(base) !== 'out') goOut(base, name, 'Ran out'); return; }
    markHave(base, name);
    commit(); openItemMenu(k);
  },
  'del-extra': () => { (sheetCtx.extraIds || []).forEach(id => remove('extras', id)); closeSheet(); commit(); },
  'pantry-filter': b => { ui.pantryF = b.dataset.v; render(); },
  unstock: () => {
    const base = sheetCtx.base, r = itemRec(base); if (!r) return;
    put('items', base, Object.assign({}, r, { hidden: true })); closeSheet(); commit(); toast('Removed ' + (r.name || base));
  },
  'quick-check': () => openQuickCheck(),
  replan: () => {
    const res = replanWeek(weekStartOf(todayISO()));
    ui.pantryDirty = false; if (!$('#sheet').hidden) closeSheet();
    if (ui.tab !== 'meals') setTab('meals'); ui.mealView = 'plan';
    commit(); okToast(res.n ? 'Re-planned ' + plural(res.n, 'meal') + ' around what we have' : 'The plan already fits what we have');
  },
  'replan-dismiss': () => { ui.pantryDirty = false; render(); },
  'pantry-set': b => {
    ui.pantryDirty = true;
    const base = b.dataset.base, v = b.dataset.v, it = pantryItems().find(i => i.base === base), name = it ? it.name : base;
    if (v === 'have') { if (statusOf(base) !== 'have') { markHave(base, name); commit(); } return; }
    if (statusOf(base) === 'out') return;
    goOut(base, name, 'Ran out'); // tapping Out puts it on the grocery list
  },
  'add-person': () => { $('#peopleRows').insertAdjacentHTML('beforeend', personRow({ name: '', color: '#7a6fb0' })); const ins = $$('#peopleRows input[type=text]'); ins[ins.length - 1].focus(); },
  'rm-person': b => b.closest('.person-row').remove(),
  'add-group': () => { $('#groupRows').insertAdjacentHTML('beforeend', groupRow({ id: '', name: '', slots: ['Breakfast', 'Lunch', 'Dinner', 'Snacks'] })); const ins = $$('#groupRows .g-name'); ins[ins.length - 1].focus(); },
  'rm-group': b => { const row = b.closest('.group-row'); ask('Remove this plan? Meals already planned for it will be hidden.', 'Remove', () => row.remove(), { danger: true }); },
  'sync-now': () => { if (!syncOn()) return toast('Fill in username, repo and token first'); runSync(); },
  'copy-setup': () => {
    if (!syncOn()) return toast('Connect GitHub first');
    const code = 'HOMEPLAN:' + b64encode(JSON.stringify({ o: sync.owner, r: sync.repo, t: sync.token, p: sync.path, b: sync.branch }));
    copyText(code).then(() => toast('Setup code copied'));
  },
  'paste-setup': () => ask('Paste the setup code from the other phone:', 'Connect', code => {
    if (!code || !code.trim()) return;
    try {
      const j = JSON.parse(b64decode(code.trim().replace(/^HOMEPLAN:/, '')));
      if (!j.o || !j.r || !j.t) throw new Error('bad');
      sync = Object.assign({}, sync, { owner: j.o, repo: j.r, token: j.t, path: j.p || 'data.json', branch: j.b || '' });
      store.set(KEY_SYNC, JSON.stringify(sync));
      openSettings(); toast('Connected — syncing'); runSync();
    } catch (e) { toast('That setup code didn’t work'); }
  }, { input: true, placeholder: 'HOMEPLAN:…' }),
  disconnect: () => ask('Stop syncing this phone? Your planner stays on this phone and in GitHub.', 'Stop syncing', () => {
    sync.token = ''; store.set(KEY_SYNC, JSON.stringify(sync)); setSync('local'); openSettings();
  }),
  export: () => {
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'home-planner-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
};

const FORMS = {
  event: f => {
    const fd = new FormData(f), title = String(fd.get('title') || '').trim(); if (!title) return;
    const date = String(fd.get('date') || '') || todayISO();
    const id = sheetCtx.eventId || uid(), prev = data.events[id], had = prev && !prev.deleted;
    put('events', id, { title: title, date: date, time: String(fd.get('time') || ''), who: String(fd.get('who') || ''), repeat: String(fd.get('repeat') || 'none'),
      notes: String(fd.get('notes') || '').trim(), skip: had ? (prev.skip || []) : [], until: had ? (prev.until || '') : '' });
    if (ui.tab === 'calendar' && !had) { ui.calWeek = weekStartOf(date); ui.month = date.slice(0, 7); ui.sel = date; }
    closeSheet(); commit(); okToast(had ? 'Event saved' : 'Event added');
  },
  'slot-text': f => {
    const t = String(new FormData(f).get('text') || '').trim(), x = ctxSlot(), key = pkey(x.d, x.g, x.s);
    if (t) put('plan', key, { recipeId: null, text: t }); else remove('plan', key);
    closeSheet(); commit();
  },
  made: f => {
    const used = $$('input[name=used]', f).filter(i => i.checked).map(i => i.value);
    const x = ctxSlot(), r = data.recipes[sheetCtx.recipeId], p = planEntry(x.d, x.g, x.s); if (!r || !p) return;
    recipeParts(r).forEach(y => {
      if (used.indexOf(y.base) >= 0) markOut(y.base, y.name, 'Used up · ' + r.name);
      else setItem(y.base, { name: (itemRec(y.base) && itemRec(y.base).name) || cap(y.name), status: 'have' });
    });
    put('plan', pkey(x.d, x.g, x.s), Object.assign({}, p, { made: true, skipped: false }));
    commit();
    const aff = affectedMeals(used, pkey(x.d, x.g, x.s));
    if (!openSwap(aff, 'Used up — heads up', used)) { closeSheet(); toast(used.length ? 'Added ' + used.length + ' to the grocery list' : 'Marked as made'); }
  },
  recipe: f => {
    const fd = new FormData(f), name = String(fd.get('name') || '').trim(); if (!name) return;
    let link = String(fd.get('link') || '').trim(); if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    const id = sheetCtx.recipeId || uid(), a = sheetCtx.assign, was = !!sheetCtx.recipeId;
    const old = was ? data.recipes[id] : null, prevMatch = (old && old.match) || '';
    let match = String(fd.get('match') || ''); if (match === id || isGone(data.recipes[match])) match = '';
    const saved = put('recipes', id, Object.assign({}, old || {}, { name: name, for: curGroup(String(fd.get('for') || 'family')), slot: String(fd.get('slot') || ''), tag: fd.get('tag') === 'try' ? 'try' : 'regular',
      ingredients: String(fd.get('ingredients') || '').replace(/\r/g, '').trim(), link: link, notes: String(fd.get('notes') || '').trim(), match: match, example: false }));
    if (prevMatch && prevMatch !== match) { const o = data.recipes[prevMatch]; if (!isGone(o) && o.match === id) put('recipes', o.id, Object.assign({}, o, { match: '' })); }
    if (match) { const o = data.recipes[match]; if (o.match !== id) put('recipes', o.id, Object.assign({}, o, { match: id })); }
    let m = null;
    if (a) { const cur = planEntry(a.date, a.gid, a.slot); m = planWithMatch(a.date, a.gid, a.slot, saved, cur && cur.recipeId); }
    commit();
    if (a) { closeSheet(); okToast(name + ' saved and planned' + matchNote(m)); }
    else { openRecipeView(id, null, '', was ? 'Your changes are in' : 'Added to ' + (saved.tag === 'try' ? 'Want to try' : regularLabel(saved))); okToast(was ? 'Recipe saved' : 'Recipe added'); }
  },
  fill: f => {
    const g = sheetCtx.gid, ws = ui.mealWeek, opts = { fam: [], kid: {}, replace: !!(f.querySelector('input[name=replace]') || {}).checked };
    $$('input[name=slot]', f).filter(i => i.checked).forEach(i => { const x = i.value.split('|'); if (x[0] === 'family') opts.fam.push(x[1]); else (opts.kid[x[0]] = opts.kid[x[0]] || []).push(x[1]); });
    if (g === 'all') kidGroups().forEach(k => { const mine = opts.kid[k.id] || []; opts.kid[k.id] = mine.concat(opts.fam.filter(x => k.slots.indexOf(x) >= 0 && mine.indexOf(x) < 0)); });
    const res = smartFill(ws, opts);
    closeSheet(); commit();
    toast(res.n ? 'Planned ' + plural(res.n, 'meal') + (res.nm ? ' + ' + res.nm + ' matching' : '') : 'Nothing to fill');
  },
  'plan-it': f => {
    const fd = new FormData(f), d = String(fd.get('date') || todayISO()), parts = String(fd.get('slot') || '').split('|'), r = data.recipes[sheetCtx.recipeId];
    if (!r || parts.length !== 2) return;
    const prev = mealLabel(d, parts[0], parts[1]), cur = planEntry(d, parts[0], parts[1]);
    const m = planWithMatch(d, parts[0], parts[1], r, cur && cur.recipeId);
    closeSheet(); toast(r.name + ' planned for ' + fmtDay(d) + matchNote(m) + (prev && prev !== r.name ? ' (replaced ' + prev + ')' : '')); commit();
  },
  'add-extra': f => {
    const inp = f.querySelector('input'), raw = inp.value.trim(); if (!raw) return;
    const sel = data.settings.stores.indexOf(ui.store) >= 0 ? ui.store : null;
    raw.split(',').map(s => s.trim()).filter(Boolean).forEach(name => {
      const base = itemKey(name);
      put('extras', uid(), { name: cap(name), checked: false, note: '' });
      if (sel && !(itemRec(base) && itemRec(base).store)) setItem(base, { name: cap(name), store: sel });
    });
    inp.value = ''; commit();
  },
  'add-stock': f => {
    const inp = f.querySelector('input'), raw = inp.value.trim(), k = f.dataset.stock; if (!raw) return;
    raw.split(',').map(x => x.trim()).filter(Boolean).forEach(name => { const base = itemKey(name), r = itemRec(base);
      put('items', base, Object.assign({}, r || {}, { name: (r && r.name) || cap(name), stock: k, hidden: false, idea: false })); });
    inp.value = ''; commit(); okToast('Added');
  },
  'add-pantry': f => {
    const inp = f.querySelector('input'), raw = inp.value.trim(); if (!raw) return;
    raw.split(',').map(s => s.trim()).filter(Boolean).forEach(name => setItem(itemKey(name), { name: cap(name), status: 'have', hidden: false }));
    inp.value = ''; commit();
  },
  settings: f => {
    const fd = new FormData(f);
    const people = $$('#peopleRows .person-row').map(r => ({ name: r.querySelector('input[type=text]').value.trim(), color: okColor(r.querySelector('input[type=color]').value) }))
      .filter(p => p.name && p.name.toLowerCase() !== 'family');
    const list = v => String(v || '').split(',').map(s => s.replace(/\|/g, '').trim()).filter(Boolean).filter((s, i, a) => a.indexOf(s) === i);
    const gs = $$('#groupRows .group-row').map(r => {
      const name = r.querySelector('.g-name').value.trim(), slots = list(r.querySelector('.g-slots').value).slice(0, 6);
      let id = r.dataset.id; if (!id) id = (name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'plan') + '-' + Math.random().toString(36).slice(2, 6);
      return { id: id, name: name || (id === 'family' ? 'Family' : 'Plan'), slots: slots.length ? slots : ['Dinner'] };
    }).filter(g => g.name);
    const stores = list(fd.get('stores')).slice(0, 5);
    data.settings = { name: String(fd.get('name') || '').trim() || 'Home', people: people, groups: gs, stores: stores.length ? stores : DEFAULT_STORES.slice(),
      weekStart: fd.get('weekStart') === '1' ? 1 : 0, updatedAt: now() };
    data = normalize(data);
    ui.calWeek = weekStartOf(ui.calWeek); ui.mealWeek = weekStartOf(ui.mealWeek);
    closeSheet(); commit(); okToast('Settings saved');
  },
  sync: f => {
    const fd = new FormData(f), g = k => String(fd.get(k) || '').trim();
    let owner = g('owner'), repo = g('repo');
    const m = repo.match(/github\.com\/([^/\s]+)\/([^/\s#?]+)/) || repo.match(/^([^/\s]+)\/([^/\s]+)$/);
    if (m) { owner = m[1]; repo = m[2]; }
    repo = repo.replace(/\.git$/, '');
    owner = owner.replace(/^@/, '');
    sync = { owner: owner, repo: repo, token: g('token'), path: g('path').replace(/^\/+/, '') || 'data.json', branch: g('branch'), device: g('device') };
    store.set(KEY_SYNC, JSON.stringify(sync));
    if (!syncOn()) { setSync('local'); toast('Fill in username, repo and token'); return; }
    toast('Connecting…'); runSync();
  }
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { setTab(tab.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (b && ACTIONS[b.dataset.act]) { e.preventDefault(); try { ACTIONS[b.dataset.act](b, e); } catch (err) { console.error(err); toast('Something went wrong — try again (' + (err && err.message || err) + ')'); } }
});
document.addEventListener('submit', e => {
  const f = e.target, fn = FORMS[f.dataset.form];
  if (fn) { e.preventDefault(); try { fn(f); } catch (err) { console.error(err); toast('Couldn’t save — ' + (err && err.message || err)); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[data-check]')) toggleRow(t.dataset.check, t.checked);
  else if (t.matches('input[data-qc]')) { // "What do we have?" checklist
    const base = t.dataset.qc; setItem(base, { name: (itemRec(base) && itemRec(base).name) || t.dataset.name, status: t.checked ? 'have' : '' });
    ui.pantryDirty = true; saveLocal(); scheduleSync();
    const c = t.dataset.cat, boxes = $$('input[data-qc]').filter(x => x.dataset.cat === c), el = $$('[data-qc-count]').find(x => x.dataset.qcCount === c);
    if (el) el.textContent = boxes.filter(x => x.checked).length + ' of ' + boxes.length;
  }
  else if (t.id === 'importFile' && t.files && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const imp = normalize(JSON.parse(rd.result)), stamp = now();
        COLLS.forEach(c => Object.keys(imp[c]).forEach(k => { const r = imp[c][k]; if (r && !r.deleted) r.updatedAt = stamp; }));
        imp.settings.updatedAt = stamp;
        data = prune(mergeData(data, imp)); closeSheet(); toast('Backup restored'); commit();
      } catch (err) { toast('That file isn’t a planner backup'); }
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'recipeSearch') { ui.recipeQ = t.value; const q = t.value.toLowerCase(); $$('#view .rec').forEach(r => { r.hidden = !!q && r.dataset.name.indexOf(q) < 0; }); $$('#view .tryrow, #view .rrow').forEach(r => { r.hidden = !!q && r.dataset.name.indexOf(q) < 0; }); }
  if (t.id === 'pickSearch') { const q = t.value.toLowerCase(); $$('.pick').forEach(r => { r.hidden = !!q && r.dataset.name.indexOf(q) < 0; }); }
  if (t.id === 'pantrySearch') { ui.pantryQ = t.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('#ask').hidden) closeAsk(); else if (!$('#sheet').hidden) closeSheet(); });

function refreshDay() { if (todayISO() !== lastDay) { resetDates(); render(); } }
if (sampleWeekDue) planSampleWeek();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refreshDay(); runSync(); } });
window.addEventListener('online', () => runSync());
setInterval(() => { refreshDay(); if (document.visibilityState === 'visible' && syncOn() && !syncing) runSync(); }, 60000);

/* ---------------- boot ---------------- */
$$('[data-icon]').forEach(el => { el.innerHTML = svg(el.dataset.icon); });
(function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#2f5d50'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#f6f1e9'; x.beginPath(); x.moveTo(90, 36); x.lineTo(148, 86); x.lineTo(132, 86); x.lineTo(132, 144); x.lineTo(48, 144); x.lineTo(48, 86); x.lineTo(32, 86); x.closePath(); x.fill();
    x.fillStyle = '#c4673a'; x.fillRect(78, 104, 24, 40);
    const u = c.toDataURL('image/png');
    $('#touchIcon').href = u;
    const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = u; document.head.appendChild(fav);
  } catch (e) {}
})();
saveLocal();
renderPill();
render();
scrollToToday();
handleLink();
window.addEventListener('hashchange', handleLink);
if (syncOn()) runSync();

window.__planner = { get data() { return data; }, readiness: readiness, proteinOf: proteinOf, smartFill: smartFill, parseLine: parseLine, guessCat: guessCat, groceryModel: groceryModel, runSync: runSync, mergeData: mergeData,
  pantryItems: pantryItems, suggestions: suggestions, recipeParts: recipeParts, storeFor: storeFor, affectedMeals: affectedMeals, statusOf: statusOf, itemKey: itemKey, normalize: normalize };
})();
</script>
</body>
